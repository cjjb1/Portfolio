<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" lang="en" aria-labelledby="title">
<title id="title">Tape wait diagnostics</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092721"/><stop offset="1" stop-color="#0c332e"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<path d="M64 84H1216M64 661H1216" stroke="#397968"/>
<g font-family="Inter, Segoe UI, sans-serif">
<text x="64" y="62" font-size="22" fill="#74ecc1" font-weight="700"><tspan x="64" dy="0">VEEAM TAPE MONITOR</tspan></text>
<text x="64" y="158" font-size="52" fill="#eefff5" font-weight="750"><tspan x="64" dy="0">Tape wait diagnostics</tspan></text>
<text x="64" y="218" font-size="23" fill="#c5e4d8" font-weight="500"><tspan x="64" dy="0">The monitor groups signals by session and shows the requested and observed Media</tspan><tspan x="64" dy="28.75">Set types and the evidence behind the finding.</tspan></text>
<g transform="translate(1030 106) scale(1.65)" stroke="#74ecc1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="31" cy="32" r="20"/><path d="m45 47 20 20M21 31h7l4-8 5 15 5-7h5"/></g>
<rect x="64" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="91" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="91" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Read job logs</tspan></text>
<rect x="652" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Reconstruct the session</tspan></text>
<rect x="64" y="472" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="91" y="500" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="91" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Compare Media Set types</tspan></text>
<rect x="652" y="472" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="500" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Show confidence and evidence</tspan></text>
</g>
</svg>
