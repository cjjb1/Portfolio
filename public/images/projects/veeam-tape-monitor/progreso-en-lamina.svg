<circle cx="407" cy="516.2" r="6" fill="#74ecc1"/><text x="399" y="597" font-size="17" fill="#b3d3c6" font-weight="500"><tspan x="399" dy="0">15 min</tspan></text>
<circle cx="644" cy="479.15" r="6" fill="#74ecc1"/><text x="636" y="597" font-size="17" fill="#b3d3c6" font-weight="500"><tspan x="636" dy="0">30 min</tspan></text>
<circle cx="881" cy="444.05" r="6" fill="#74ecc1"/><text x="873" y="597" font-size="17" fill="#b3d3c6" font-weight="500"><tspan x="873" dy="0">45 min</tspan></text>
<circle cx="1118" cy="410.9" r="6" fill="#74ecc1"/><text x="1110" y="597" font-size="17" fill="#b3d3c6" font-weight="500"><tspan x="1110" dy="0">60 min</tspan></text>
