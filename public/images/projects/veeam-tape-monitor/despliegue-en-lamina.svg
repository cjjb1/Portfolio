<path d="M64 84H1216M64 661H1216" stroke="#397968"/>
<g font-family="Inter, Segoe UI, sans-serif">
<text x="64" y="62" font-size="22" fill="#74ecc1" font-weight="700"><tspan x="64" dy="0">VEEAM TAPE MONITOR</tspan></text>
<text x="64" y="158" font-size="52" fill="#eefff5" font-weight="750"><tspan x="64" dy="0">Deployment and access</tspan></text>
<text x="64" y="218" font-size="23" fill="#c5e4d8" font-weight="500"><tspan x="64" dy="0">A WinSW service runs the monitor on Windows Server. Authenticated HTTPS access can</tspan><tspan x="64" dy="28.75">be enabled on the private network.</tspan></text>
<g transform="translate(1030 106) scale(1.65)" stroke="#74ecc1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="14" y="12" width="51" height="20" rx="4"/><rect x="14" y="45" width="51" height="20" rx="4"/><path d="M23 22h4m-4 33h4m12-23v13"/></g>
<rect x="64" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="91" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="91" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Windows Server service</tspan></text>
<rect x="652" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Monitor and local SQLite</tspan></text>
