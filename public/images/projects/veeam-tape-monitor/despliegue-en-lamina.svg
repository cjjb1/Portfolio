<text x="91" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Authenticated local access</tspan></text>
<rect x="652" y="472" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="500" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Optional private HTTPS</tspan></text>
