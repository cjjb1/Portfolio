<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" lang="en" aria-labelledby="title">
<title id="title">Media operations</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092721"/><stop offset="1" stop-color="#0c332e"/></linearGradient></defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<path d="M64 84H1216M64 661H1216" stroke="#397968"/>
<g font-family="Inter, Segoe UI, sans-serif">
<text x="64" y="62" font-size="22" fill="#74ecc1" font-weight="700"><tspan x="64" dy="0">VEEAM TAPE MONITOR</tspan></text>
<text x="64" y="158" font-size="52" fill="#eefff5" font-weight="750"><tspan x="64" dy="0">Media operations</tspan></text>
<text x="64" y="218" font-size="23" fill="#c5e4d8" font-weight="500"><tspan x="64" dy="0">The administrator can request inventory, cataloging, verification, import, export</tspan><tspan x="64" dy="28.75">or rename operations and track the outcome in the dashboard.</tspan></text>
<g transform="translate(1030 106) scale(1.65)" stroke="#74ecc1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15 27h48M15 52h48"/><circle cx="30" cy="27" r="7" fill="#103b34"/><circle cx="50" cy="52" r="7" fill="#103b34"/></g>
<rect x="64" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="91" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="91" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Validate account and target</tspan></text>
<rect x="652" y="306" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="334" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="377" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Record the operation</tspan></text>
<rect x="64" y="472" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="91" y="500" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="91" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="91" dy="0">Run the Veeam cmdlet</tspan></text>
<rect x="652" y="472" width="564" height="142" rx="18" fill="#103b34" stroke="#397968"/>
<rect x="679" y="500" width="34" height="5" rx="2" fill="#74ecc1"/>
<text x="679" y="543" font-size="29" fill="#e2fbed" font-weight="650"><tspan x="679" dy="0">Update status and result</tspan></text>
</g>
</svg>
