<text x="64" y="158" font-size="52" fill="#eefff5" font-weight="750"><tspan x="64" dy="0">ZIP archives and evidence</tspan></text>
<text x="64" y="218" font-size="23" fill="#c5e4d8" font-weight="500"><tspan x="64" dy="0">Each ZIP archive is validated and processed in a scope separate from live</tspan><tspan x="64" dy="28.75">monitoring.</tspan></text>
